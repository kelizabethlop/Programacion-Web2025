name: build-and-deploy

on:
  push:
    branches: [ hw-04 ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Código
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Node + dependencias + build
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      # 3) Doppler CLI
      - name: Setup Doppler
        uses: dopplerhq/cli-action@v3
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}

      # 4) Exportar secretos de Doppler al entorno del runner
      - name: Export env from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler secrets download --no-file --format env | tee -a "$GITHUB_ENV" > /dev/null

      # 5) Normalizar credenciales y región (quita comillas/espacios)
      - name: Normalize AWS creds and region
        run: |
          K="${AWS_ACCESS_KEY_ID}"; K=${K//\"/}; K=${K// /}
          S="${AWS_SECRET_ACCESS_KEY}"; S=${S//\"/}; S=${S// /}
          R="${AWS_REGION}"; R=${R//\"/}; R=${R// /}
          echo "AWS_ACCESS_KEY_ID_NORM=$K" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY_NORM=$S" >> "$GITHUB_ENV"
          echo "AWS_REGION_NORM=$R" >> "$GITHUB_ENV"

      # 6) Configurar credenciales AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID_NORM }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY_NORM }}
          aws-region: ${{ env.AWS_REGION_NORM }}

      # 7) Verificar identidad (STS) — si esto pasa, las credenciales son válidas
      - name: Verify AWS identity (STS)
        run: aws sts get-caller-identity

      # 8) Comprobar variables necesarias para deploy
      - name: Check required env names
        run: |
          for v in S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Environment variable '$v' is empty or missing"; exit 1;
            fi
          done

      # 9) Subir build a S3
      - name: Upload to S3
        run: aws s3 sync dist/ "s3://${{ env.S3_BUCKET }}" --delete

      # 10) Invalidar CloudFront (UNA sola línea)
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"

