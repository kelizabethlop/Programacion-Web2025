name: build-and-deploy

on:
  push:
    branches: [ hw-04 ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Setup Doppler
        uses: dopplerhq/cli-action@v3

      - name: Export env from Doppler
        run: |
          doppler secrets download \
            --project programacion-web2025 \
            --config prd \
            --token ${{ secrets.DOPPLER_TOKEN }} \
            --no-file --format env >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check required env names
        run: |
          for v in S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Environment variable '$v' is empty or missing"; exit 1;
            fi
          done

      - name: Upload to S3
        run: aws s3 sync dist/ "s3://${{ env.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
